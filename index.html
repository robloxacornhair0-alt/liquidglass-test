<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <svg style="display: none;" aria-hidden="true">
        <defs>
            <filter id="glass-distort" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur" />
                
                <feTurbulence type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="3" seed="9" result="noise" />
                
                <feDisplacementMap in="blur" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="liquid-bg" id="liquidBg">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="blob b4"></div>
    </div>

    <div class="glass-card">
        <div class="glass-dome"></div>
        
        <h2>Liquid Glass</h2>
        <p>This card uses an SVG displacement filter to cleanly warp the fluid, morphing background shapes underneath it.</p>
        
        <label for="bg-upload" class="bg-btn" id="magBtn">Background</label>
        <input type="file" id="bg-upload" accept="image/*">
    </div>

    <script>
        /* ── Background upload ── */
        const bgUpload = document.getElementById('bg-upload');
        const liquidBg = document.getElementById('liquidBg');

        bgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                document.body.style.backgroundImage = `url('${url}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                liquidBg.style.display = 'none';
            }
        });
    </script>
</body>
</html>
