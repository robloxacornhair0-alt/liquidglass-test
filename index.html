<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass — WebGL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="liquid-bg" id="liquidBg">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="blob b4"></div>
    </div>

    <div class="glass-card-wrapper">
        <canvas id="webgl-canvas"></canvas>
        
        <div class="glass-card-content">
            <div class="glass-dome"></div>
            <h2>Liquid Glass</h2>
            <p>WebGL Engine: Blur 0.5 | Refraction 25 | Chromatic Aberration 0</p>
            
            <label for="bg-upload" class="bg-btn">Background</label>
            <input type="file" id="bg-upload" accept="image/*">
        </div>
    </div>

    <script src="webgl-render.js"></script>
    <script>
        const bgUpload = document.getElementById('bg-upload');
        const liquidBg = document.getElementById('liquidBg');

        bgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                document.body.style.backgroundImage = `url('${url}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                liquidBg.style.display = 'none';
            }
        });
    </script>
</body>
</html>
