<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64">
  <defs>
    <linearGradient id="glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111218" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1f29" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="rim-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="liquid-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="premium-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="272" height="56" rx="28" fill="url(#glass-base)" stroke="url(#rim-light)" stroke-width="1.25" filter="url(#premium-shadow)"/>
  
  <rect x="6" y="6" width="266" height="26" rx="13" fill="url(#liquid-shine)"/>

  <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#ffffff" letter-spacing="0.4">Liquid Glass Website</text>
</svg>
