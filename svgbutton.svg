<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64">
  <defs>
    <linearGradient id="glass-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="rim-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="liquid-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="272" height="56" rx="28" fill="url(#glass-base)" stroke="url(#rim-light)" stroke-width="1.5" filter="url(#glow)"/>
  
  <rect x="5" y="5" width="270" height="54" rx="27" fill="url(#liquid-shine)"/>

  <text x="50%" y="53%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, sans-serif" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="0.5" style="text-shadow: 0px 2px 5px rgba(0,0,0,0.5);">✨ Liquid Glass</text>
</svg>
